name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jammaru/llm-abi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node-version: "24"

      - name: Show publish toolchain
        run: |
          set -euo pipefail
          node --version
          npm --version
          echo "OIDC request URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"

      - name: Verify tag matches package.json
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing llm-abi@$VERSION"

      - name: Publish to npm
        working-directory: packages/core
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "llm-abi@$VERSION" version >/dev/null 2>&1; then
            echo "llm-abi@$VERSION already on npm — skip publish"
            exit 0
          fi
          pnpm --filter llm-abi build
          unset NODE_AUTH_TOKEN
          # npm 11+ exchanges GitHub OIDC when no classic token is configured.
          npm publish --access public

      - name: Create GitHub Release
        if: ${{ always() && steps.ver.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists"
            exit 0
          fi
          NOTES="$(awk -v ver="$VERSION" '
            $0 == "## " ver {grab=1; next}
            /^## / && grab {exit}
            grab {print}
          ' packages/core/CHANGELOG.md)"
          gh release create "v${VERSION}" \
            --title "llm-abi ${VERSION}" \
            --notes "$NOTES" \
            --verify-tag
