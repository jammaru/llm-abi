name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

jobs:
  release:
    if: github.repository == 'jammaru/llm-abi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: npm install -g npm@^11.5.1
      - uses: changesets/action@v2
        id: changesets
        with:
          publish-script: pnpm release
          pr-title: Release
          commit-message: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Tag the GitHub Action
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "$PACKAGES" | jq -r '.[] | select(.name=="llm-abi") | .version')"
          test -n "$version"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${version}" \
            -f sha="${GITHUB_SHA}"
