name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'jammaru/llm-abi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: npm install -g npm@^11.5.1

      - name: Verify tag matches package.json
        id: ver
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing llm-abi@$VERSION"

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if npm view "llm-abi@$VERSION" version >/dev/null 2>&1; then
            echo "llm-abi@$VERSION already on npm — skip publish"
          else
            pnpm release
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists"
            exit 0
          fi
          NOTES="$(awk -v ver="$VERSION" '
            $0 == "## " ver {grab=1; next}
            /^## / && grab {exit}
            grab {print}
          ' packages/core/CHANGELOG.md)"
          gh release create "v${VERSION}" \
            --title "llm-abi ${VERSION}" \
            --notes "$NOTES" \
            --verify-tag
