name: Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @llm-abi/playground build
      - name: Deploy to Cloudflare Pages
        working-directory: packages/playground
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0ec81dbbaae1f46788680a0276fe1fd7
        run: pnpm dlx wrangler@4 pages deploy dist --project-name=llm-abi --commit-dirty=true
